{% extends 'base.html' %}

{% block title %}{{ error_code }} - {{ error_title }} &bull; FaceSense AI{% endblock %}

{% block content %}
<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 text-center">
      <div class="glass-card p-5 shadow-lg position-relative overflow-hidden">
        <div class="glow-orb glow-orb-primary" style="top: -80px; left: -80px;"></div>
        
        <div class="display-1 fw-bold text-gradient mb-2" style="font-size: 5rem;">{{ error_code }}</div>
        
        <div class="brand-icon-wrapper mx-auto mb-3" style="width: 58px; height: 58px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);">
          <i class="bi bi-exclamation-triangle-fill fs-3 text-warning"></i>
        </div>

        <h2 class="h3 fw-bold text-white mb-2">{{ error_title }}</h2>
        <p class="text-muted small mb-4" style="line-height: 1.6;">
          {{ error_message }}
        </p>

        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('home') }}" class="btn btn-primary-gradient px-4">
            <i class="bi bi-house-door-fill me-1"></i> Return Home
          </a>
          <a href="{{ url_for('detector') }}" class="btn btn-outline-glow px-4">
            <i class="bi bi-camera-video me-1"></i> Live Detector
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
